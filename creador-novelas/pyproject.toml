[project]
name = "creador-novelas"
version = "0.1.0"
description = "Harness determinista para la generación de novelas de terror espacial (spec técnica v1.4)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "tiktoken"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
