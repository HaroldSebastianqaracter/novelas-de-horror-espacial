\* Toda ejecucion termina aunque las puertas y los agentes fallen sin limite: lo que la acota
\* son los reintentos (MaxIntentos por capitulo, dos escaletas), no la suerte. La caida y el
\* parar, uno como mucho; el autor relanza una vez.
SPECIFICATION Spec

CONSTANTS
    N = 5
    MaxIntentos = 3
    MaxFallos = 1
    MaxRegeneraciones = 1
    ConCambioDelLector = TRUE
    CambioRevalidaPuertas = TRUE
    FallosDePuertaAcotados = FALSE
    MaxReinicios = 1
    PresupuestoRevierteEnLaParada = TRUE
    RecuperarRevierteEnParada = TRUE

INVARIANTS
    PublicacionConPuertas
    CompletadaConNovela
    SinCapituloAMedias
    AMediasSoloElActual
    ReintentosAcotados
    CapituloConPuertas
    SinTransicionInvalida
    ParadaCoherente
    SoloElAlcance
    CambioFallidoNoAplica

PROPERTIES
    VersionesInmutables
    ReanudarNoPierde
    CierreUnico
    EjecucionTermina
